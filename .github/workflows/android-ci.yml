name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build-and-verify:
    name: Build, Lint, JVM Tests & Python Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35 and Build Tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper binary & permissions
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Run JVM unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android Lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python verification suites
        run: |
          python3 test_suite_phase04.py
          python3 test_suite_phase05.py
          python3 test_suite_phase06.py
          python3 test_suite_phase07.py
          python3 test_suite_stage01.py
          python3 test_suite_stage02.py
          python3 test_suite_stage03.py
          python3 test_suite_stage04.py

      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mechanical-pro-notes-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android Lint & JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanical-pro-notes-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
            android/app/schemas/
          if-no-files-found: ignore

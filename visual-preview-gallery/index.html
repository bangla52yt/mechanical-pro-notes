<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mechanical Pro Notes — Visual Preview Gallery &amp; UI Audit</title>
<style>
  :root {
    --shell-bg: #0b0d11;
    --shell-panel: #151922;
    --shell-border: #2a3140;
    --shell-text: #e6ecf5;
    --shell-muted: #93a0b8;
    --accent: #63b3ed;
    --amber: #f6ad55;
    --green: #68d391;
    --red: #fc8181;
    --blue-badge: #2a4365;
    --phone-w: 380px;
  }

  /* Android App Material 3 Theme Variables inside Phone Frame */
  .phone-frame[data-theme="dark"] {
    --m3-bg: #121418;
    --m3-surface: #1A1D24;
    --m3-surface-var: #242832;
    --m3-outline: #3E4452;
    --m3-text: #EAECEF;
    --m3-text-var: #A0AEC0;
    --m3-primary: #63B3ED;
    --m3-on-primary: #003355;
    --m3-primary-cont: #2A4365;
    --m3-on-primary-cont: #D6EBFF;
    --m3-secondary: #F6AD55;
    --m3-sec-cont: #473219;
    --m3-on-sec-cont: #FDE3C0;
    --m3-error: #FC8181;
    --m3-err-cont: #4A1E24;
    --m3-on-err-cont: #FED7D7;
    --m3-green: #68D391;
    --m3-green-cont: #1D4031;
    --m3-on-green-cont: #C6F6D5;
    --m3-warn: #F6AD55;
    --m3-warn-cont: #473219;
    --m3-on-warn-cont: #FEEBC8;
  }
  .phone-frame[data-theme="light"] {
    --m3-bg: #F4F6F9;
    --m3-surface: #FFFFFF;
    --m3-surface-var: #E5E9F0;
    --m3-outline: #B0B7C3;
    --m3-text: #1A202C;
    --m3-text-var: #4A5568;
    --m3-primary: #2B6CB0;
    --m3-on-primary: #FFFFFF;
    --m3-primary-cont: #D8E8FA;
    --m3-on-primary-cont: #12375E;
    --m3-secondary: #DD6B20;
    --m3-sec-cont: #FDE9D8;
    --m3-on-sec-cont: #5C2908;
    --m3-error: #E53E3E;
    --m3-err-cont: #FED7D7;
    --m3-on-err-cont: #742A2A;
    --m3-green: #2E7D32;
    --m3-green-cont: #C6F6D5;
    --m3-on-green-cont: #1C4532;
    --m3-warn: #ED6C02;
    --m3-warn-cont: #FEEBC8;
    --m3-on-warn-cont: #7B341E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--shell-bg);
    color: var(--shell-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", Arial, sans-serif;
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }

  /* Top Companion Bar */
  .studio-topbar {
    position: sticky;
    top: 0;
    z-index: 60;
    background: #10131a;
    border-bottom: 1px solid var(--shell-border);
    padding: 6px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 48px;
  }
  .studio-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .studio-brand h1 {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .studio-brand .sub {
    font-size: 11px;
    color: var(--shell-muted);
    white-space: nowrap;
  }
  .studio-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: var(--shell-panel);
    color: var(--shell-text);
    border: 1px solid var(--shell-border);
    border-radius: 8px;
    padding: 0 10px;
    min-height: 36px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .ctrl-btn:hover { border-color: var(--accent); }
  .ctrl-btn.active {
    background: var(--blue-badge);
    border-color: var(--accent);
    color: #fff;
  }
  .ctrl-btn.warn-btn {
    border-color: #7c4d1a;
    color: var(--amber);
  }
  .ctrl-btn.warn-btn.active {
    background: #473219;
    border-color: var(--amber);
  }

  /* Main Responsive Grid */
  .workspace {
    display: grid;
    grid-template-columns: 290px minmax(360px, 1fr) 330px;
    gap: 16px;
    padding: 14px 16px 24px;
    max-width: 1480px;
    margin: 0 auto;
    align-items: start;
  }

  .panel {
    background: var(--shell-panel);
    border: 1px solid var(--shell-border);
    border-radius: 14px;
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--shell-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .panel-header h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  .panel-body {
    padding: 10px 12px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
  }

  /* Module Index Items */
  .group-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--shell-muted);
    letter-spacing: 0.06em;
    margin: 10px 4px 6px;
    text-transform: uppercase;
  }
  .mod-btn {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 4px;
    color: var(--shell-text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 44px;
  }
  .mod-btn:hover { background: rgba(99,179,237,0.08); }
  .mod-btn.active {
    background: rgba(99,179,237,0.16);
    border-color: var(--accent);
  }
  .mod-btn .mod-title { font-size: 12.5px; font-weight: 600; display: block; }
  .mod-btn .mod-route { font-size: 10.5px; color: var(--shell-muted); font-family: ui-monospace, monospace; }

  /* Status Pills inside Companion Audit UI */
  .badge {
    font-size: 9.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    white-space: nowrap;
    letter-spacing: 0.03em;
  }
  .b-impl { background: #1d4031; color: #68d391; border: 1px solid #2f855a; }
  .b-partial { background: #2a4365; color: #90cdf4; border: 1px solid #4299e1; }
  .b-generic { background: #3b2f16; color: #f6ad55; border: 1px solid #b7791f; }
  .b-gap { background: #4a1e24; color: #fc8181; border: 1px solid #c53030; }
  .b-unverified { background: #2d2640; color: #d6bcfa; border: 1px solid #805ad5; }

  /* Phone Center Stage */
  .phone-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .width-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--shell-muted);
    flex-wrap: wrap;
    justify-content: center;
  }
  .phone-frame {
    width: var(--phone-w);
    max-width: 100%;
    height: 760px;
    background: var(--m3-bg);
    color: var(--m3-text);
    border-radius: 28px;
    border: 6px solid #252b38;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    font-size: var(--app-font-size, 14px);
    transition: width 0.2s ease;
  }
  .phone-frame.legible { --app-font-size: 16.5px; }

  /* Simulated Android Status Bar */
  .sys-bar {
    height: 24px;
    background: var(--m3-surface);
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: var(--m3-text-var);
    border-bottom: 1px solid rgba(128,128,128,0.12);
    flex-shrink: 0;
  }

  /* M3 TopAppBar */
  .m3-topbar {
    min-height: 54px;
    background: var(--m3-surface);
    padding: 4px 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    border-bottom: 1px solid var(--m3-outline);
    flex-shrink: 0;
  }
  .m3-icon-btn {
    width: 46px;
    height: 46px;
    border-radius: 23px;
    border: none;
    background: transparent;
    color: var(--m3-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .m3-icon-btn:hover { background: rgba(128,128,128,0.16); }
  .m3-icon-btn.primary { color: var(--m3-primary); }
  .m3-topbar-title {
    flex: 1;
    min-width: 0;
  }
  .m3-topbar-title .t-main {
    font-size: 1.15em;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .m3-topbar-title .t-sub {
    font-size: 0.72em;
    color: var(--m3-text-var);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Main Scrollable Phone Viewport */
  .m3-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Bottom Navigation Bar (4 items, shown on 4 primary routes) */
  .m3-bottombar {
    height: 64px;
    background: var(--m3-surface);
    border-top: 1px solid var(--m3-outline);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    flex-shrink: 0;
  }
  .m3-nav-item {
    border: none;
    background: transparent;
    color: var(--m3-text-var);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 2px;
    position: relative;
  }
  .m3-nav-item .pill-ind {
    padding: 3px 14px;
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .m3-nav-item.active { color: var(--m3-primary); }
  .m3-nav-item.active .pill-ind {
    background: var(--m3-primary-cont);
    color: var(--m3-primary);
  }
  .m3-nav-item .bug-tag {
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 8px;
    background: #c53030;
    color: #fff;
    padding: 0 3px;
    border-radius: 3px;
  }

  /* Modal Navigation Drawer inside Phone */
  .drawer-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.58);
    z-index: 40;
    display: none;
  }
  .drawer-backdrop.open { display: flex; }
  .m3-drawer {
    width: 286px;
    max-width: 84%;
    height: 100%;
    background: var(--m3-surface);
    color: var(--m3-text);
    overflow-y: auto;
    box-shadow: 4px 0 24px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
  }
  .drawer-hero {
    background: var(--m3-primary-cont);
    color: var(--m3-on-primary-cont);
    padding: 18px 16px;
  }
  .drawer-hero h3 { font-size: 1.1em; font-weight: 700; }
  .drawer-hero p { font-size: 0.78em; opacity: 0.85; margin-top: 2px; }
  .drawer-hero .stats { font-size: 0.72em; color: var(--m3-primary); font-weight: 700; margin-top: 6px; }
  .drawer-sec {
    font-size: 0.68em;
    font-weight: 700;
    color: var(--m3-text-var);
    padding: 10px 16px 4px;
    letter-spacing: 0.05em;
  }
  .drawer-item {
    border: none;
    background: transparent;
    color: var(--m3-text);
    text-align: left;
    padding: 8px 14px;
    margin: 1px 8px;
    border-radius: 24px;
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    width: calc(100% - 16px);
  }
  .drawer-item:hover { background: var(--m3-surface-var); }
  .drawer-item.active {
    background: var(--m3-primary-cont);
    color: var(--m3-on-primary-cont);
  }
  .drawer-item .di-en { font-size: 0.88em; font-weight: 600; display: block; }
  .drawer-item .di-bn { font-size: 0.7em; color: var(--m3-text-var); display: block; }
  .drawer-div { height: 1px; background: var(--m3-outline); opacity: 0.45; margin: 6px 16px; }

  /* M3 Reusable Cards & Widgets */
  .m3-card {
    background: var(--m3-surface);
    border: 1px solid rgba(128,128,128,0.2);
    border-radius: 12px;
    padding: 13px;
  }
  .m3-card.variant { background: var(--m3-surface-var); }
  .m3-card.primary-box {
    background: var(--m3-primary-cont);
    border: 1.5px solid var(--m3-primary);
    color: var(--m3-on-primary-cont);
  }
  .m3-card.clickable { cursor: pointer; }
  .m3-card.clickable:hover { border-color: var(--m3-primary); }

  .safety-card {
    border-radius: 12px;
    padding: 12px 13px;
    background: var(--m3-warn-cont);
    border: 1px solid var(--m3-warn);
    color: var(--m3-on-warn-cont);
  }
  .safety-card.statutory {
    background: var(--m3-err-cont);
    border-color: var(--m3-error);
    color: var(--m3-on-err-cont);
  }
  .safety-card .sc-title {
    font-size: 0.85em;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .safety-card .sc-msg { font-size: 0.8em; line-height: 1.38; }

  .formula-card {
    background: var(--m3-surface-var);
    border-radius: 10px;
    padding: 11px 12px;
    border: 1px solid var(--m3-outline);
  }
  .formula-card .fc-title { font-size: 0.82em; font-weight: 700; color: var(--m3-primary); margin-bottom: 4px; }
  .formula-card .fc-eq {
    font-family: ui-monospace, "Cascadia Mono", monospace;
    font-size: 0.8em;
    background: rgba(0,0,0,0.2);
    padding: 6px 8px;
    border-radius: 6px;
    word-break: break-word;
    margin-bottom: 6px;
  }
  .formula-card .fc-ref { font-size: 0.72em; color: var(--m3-text-var); }

  .m3-btn {
    min-height: 46px;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.86em;
    font-weight: 700;
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }
  .m3-btn.filled { background: var(--m3-primary); color: var(--m3-on-primary); }
  .m3-btn.filled:disabled { opacity: 0.45; cursor: not-allowed; }
  .m3-btn.outlined { background: transparent; border-color: var(--m3-outline); color: var(--m3-text); }
  .m3-btn.tonal { background: var(--m3-primary-cont); color: var(--m3-on-primary-cont); }
  .m3-btn.danger { background: var(--m3-err-cont); border-color: var(--m3-error); color: var(--m3-on-err-cont); }
  .m3-btn.full { width: 100%; }

  .chip-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .m3-chip {
    min-height: 36px;
    padding: 4px 11px;
    border-radius: 8px;
    border: 1px solid var(--m3-outline);
    background: var(--m3-surface);
    color: var(--m3-text);
    font-size: 0.76em;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .m3-chip.selected {
    background: var(--m3-primary-cont);
    border-color: var(--m3-primary);
    color: var(--m3-on-primary-cont);
  }

  .m3-tabs {
    display: flex;
    border-bottom: 1px solid var(--m3-outline);
    background: var(--m3-surface);
    overflow-x: auto;
    flex-shrink: 0;
  }
  .m3-tab {
    flex: 1 0 auto;
    min-height: 44px;
    padding: 6px 12px;
    background: transparent;
    border: none;
    border-bottom: 2.5px solid transparent;
    color: var(--m3-text-var);
    font-size: 0.78em;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .m3-tab.active {
    color: var(--m3-primary);
    border-bottom-color: var(--m3-primary);
  }

  .m3-input {
    width: 100%;
    min-height: 44px;
    padding: 8px 11px;
    border-radius: 8px;
    border: 1px solid var(--m3-outline);
    background: var(--m3-surface);
    color: var(--m3-text);
    font-size: 0.88em;
    font-family: inherit;
  }
  .m3-input:focus { outline: 2px solid var(--m3-primary); border-color: var(--m3-primary); }
  select.m3-input { cursor: pointer; }

  .depth-pill {
    font-size: 0.68em;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
  }
  .dp-full { background: var(--m3-green-cont); color: var(--m3-on-green-cont); }
  .dp-partial { background: var(--m3-primary-cont); color: var(--m3-on-primary-cont); }
  .dp-pending { background: var(--m3-warn-cont); color: var(--m3-on-warn-cont); }
  .dp-inv { background: var(--m3-surface-var); color: var(--m3-text-var); border: 1px solid var(--m3-outline); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat-tile {
    background: var(--m3-surface-var);
    border-radius: 8px;
    padding: 8px 4px;
    text-align: center;
  }
  .stat-tile .sv { font-size: 1.15em; font-weight: 800; }
  .stat-tile .sl { font-size: 0.68em; color: var(--m3-text-var); }

  /* Audit Annotations inside Inspector & Phone */
  .audit-callout {
    border: 1px dashed var(--amber);
    background: rgba(246,173,85,0.1);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.74em;
    color: var(--m3-text);
  }
  .audit-callout strong { color: var(--amber); }

  .inspector-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 12.5px;
  }
  .insp-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--shell-border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .insp-card h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--shell-muted);
    margin-bottom: 6px;
  }
  .insp-list { padding-left: 16px; display: flex; flex-direction: column; gap: 5px; }
  .insp-list li { font-size: 12px; }
  .code-ref { font-family: ui-monospace, monospace; font-size: 11px; color: var(--accent); word-break: break-all; }

  .check-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    min-height: 46px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--m3-surface);
    border: 1px solid rgba(128,128,128,0.18);
    cursor: pointer;
  }
  .check-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    accent-color: var(--m3-primary);
    flex-shrink: 0;
  }

  .svg-box {
    background: #0d1117;
    border: 1px solid var(--m3-outline);
    border-radius: 10px;
    padding: 8px;
    text-align: center;
  }
  .svg-box svg { width: 100%; height: auto; max-height: 190px; display: block; margin: 0 auto; }

  /* Modal dialog overlay inside phone frame */
  .m3-dialog-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .m3-dialog {
    width: 100%;
    max-height: 82%;
    overflow-y: auto;
    background: var(--m3-surface);
    color: var(--m3-text);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid var(--m3-outline);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Responsive Drawer/Tabs for Narrow Mobile Viewports (360px-959px) */
  .mobile-only { display: none; }
  @media (max-width: 980px) {
    .workspace {
      grid-template-columns: 1fr;
      padding: 8px 8px 28px;
      gap: 10px;
    }
    .panel-left, .panel-right { display: none; }
    .panel-left.mob-open, .panel-right.mob-open { display: block; }
    .mobile-only { display: inline-flex; }
    .studio-brand .sub { display: none; }
    .phone-frame {
      height: min(740px, calc(100vh - 110px));

const CALCULATIONS = [
  { id:"CALC-01", title:"Boiler Thermal Efficiency (Direct Method)", bn:"বয়লার থার্মাল এফিসিয়েন্সি (ডাইরেক্ট মেথড)", cat:"Boiler Thermal", status:"IMPLEMENTED", formula:"eta = m_s * (h_s - h_w) / (m_f * NCV) * 100", ref:"ASME PTC 4", assumptions:"Steady-state steam pressure & continuous feedwater temp.", limitations:"Does not break down dry flue gas or unburnt jhut carbon losses.", inputs:[{k:"ms",l:"Steam Flow Rate m_s (kg/h)",v:4000},{k:"hs",l:"Steam Enthalpy h_s (kJ/kg)",v:2781.3},{k:"hw",l:"Feedwater Enthalpy h_w (kJ/kg)",v:376.9},{k:"mf",l:"Fuel Firing Rate m_f (unit/h)",v:310},{k:"ncv",l:"Fuel NCV (kJ/unit)",v:35500}], run:(v)=>({primary:`${((v.ms*(v.hs-v.hw))/(v.mf*v.ncv)*100).toFixed(2)} %`, sub:`Heat Output: ${((v.ms*(v.hs-v.hw))/3600).toFixed(1)} kW | Heat Input: ${((v.mf*v.ncv)/3600).toFixed(1)} kW`}) },
  { id:"CALC-02", title:"Boiler Efficiency (Heat Loss / Indirect Method)", bn:"বয়লার ইনডাইরেক্ট এফিসিয়েন্সি (হিট লস পদ্ধতি)", cat:"Boiler Thermal", status:"IMPLEMENTED", formula:"eta = 100 - (L_dry + L_H2 + L_moist + L_air + L_unburnt + L_rad)", ref:"ASME PTC 4-2013 / BS 845-1 / IS 8753", assumptions:"Natural gas uses Siegert K=0.38, A0=17.0 kg/kg, and kJ/Nm3 + fuel_density parity.", limitations:"Mixed garment jhut (fuel_type=2) retains explicit UNVERIFIED calibration boundary unless lab GCV/H2%/siegert_k/A0 are supplied.", inputs:[{k:"tf",l:"Flue Gas Temp (°C)",v:185},{k:"ta",l:"Ambient Temp (°C)",v:30},{k:"co2",l:"Flue CO2 (%)",v:9.5},{k:"gcv",l:"Fuel GCV (kJ/kg mass basis)",v:53784},{k:"h2",l:"Fuel H2 (%)",v:23.0}], run:(v)=>{ const dt=v.tf-v.ta; if(dt<=0) return {error:"Flue temp must exceed ambient."}; const l1=0.38*dt/v.co2; const l2=9*(v.h2/100)*(2442+2.09*dt)/v.gcv*100; const l4=(17*0.015*2.09*dt)/v.gcv*100; const eff=100-(l1+l2+l4); return {primary:`${eff.toFixed(2)} % (GCV Gas Basis)`, sub:`L1 Dry Flue=${l1.toFixed(2)}%, L2 H2=${l2.toFixed(2)}%, L4 Air=${l4.toFixed(2)}% (Mixed-Jhut requires lab calibration)`}; } },
  { id:"CALC-03", title:"Boiler Fuel Firing Rate Requirement", bn:"বয়লার ফুয়েল ফায়ারিং রেট হিসাব", cat:"Boiler Thermal", status:"IMPLEMENTED", formula:"m_f = [m_s * (h_s - h_w)] / [(eta/100) * NCV]", ref:"ASME PTC 4", assumptions:"Steady thermal load at assumed boiler efficiency.", limitations:"Must use matching numerator/denominator mass or Nm3 units.", inputs:[{k:"ms",l:"Steam Demand m_s (kg/h)",v:5000},{k:"hs",l:"Steam Enthalpy h_s (kJ/kg)",v:2778},{k:"hw",l:"Feedwater Enthalpy h_w (kJ/kg)",v:377},{k:"eta",l:"Efficiency (%)",v:84},{k:"ncv",l:"Fuel NCV (kJ/unit)",v:35500}], run:(v)=>({primary:`${((v.ms*(v.hs-v.hw))/((v.eta/100)*v.ncv)).toFixed(2)} unit/h`, sub:`Fuel Heat Input: ${(((v.ms*(v.hs-v.hw))/(v.eta/100))/3600).toFixed(1)} kW`}) },
  { id:"CALC-04", title:"Steam-to-Fuel Evaporation Ratio", bn:"স্টিম-টু-ফুয়েল ইভাপোরেশন রেশিও", cat:"Boiler Thermal", status:"IMPLEMENTED", formula:"ER = m_s / m_f", ref:"Plant Benchmark Log", assumptions:"Consistent mass flow or volumetric metering.", limitations:"Gas boilers (~12-14 kg/Nm3) differ strongly from Jhut (~2.5-3.5 kg/kg).", inputs:[{k:"ms",l:"Steam Generated m_s (kg/h)",v:4000},{k:"mf",l:"Fuel Consumed m_f (unit/h)",v:310}], run:(v)=>({primary:`${(v.ms/v.mf).toFixed(2)} kg steam / unit fuel`, sub:"Verify fuel unit (Nm3 gas vs kg Jhut)"}) },
  { id:"CALC-05", title:"Boiler Continuous Blowdown Rate", bn:"বয়লার ব্লো-ডাউন রেট ক্যালকুলেশন", cat:"Boiler Water", status:"IMPLEMENTED", formula:"BD% = [TDS_feed / (TDS_boiler - TDS_feed)] * 100", ref:"BS 2486 / Spirax Sarco", assumptions:"Dissolved solids stay soluble; TDS_boiler > TDS_feed.", limitations:"Excludes suspended mud removed via intermittent bottom blowdown.", inputs:[{k:"tf",l:"Feedwater TDS (ppm)",v:180},{k:"tb",l:"Max Allowable Drum TDS (ppm)",v:3000},{k:"ms",l:"Steam Output (kg/h)",v:4000}], run:(v)=>({primary:`${((v.tf/(v.tb-v.tf))*100).toFixed(2)} %`, sub:`Blowdown Flow: ${(v.ms*(v.tf/(v.tb-v.tf))).toFixed(1)} kg/h`}) },
  { id:"CALC-06", title:"Blowdown Flash Steam & Heat Recovery", bn:"ব্লো-ডাউন হিট রিকভারি ও ফ্ল্যাশ স্টিম সাশ্রয়", cat:"Boiler Thermal", status:"IMPLEMENTED", formula:"Flash% = (h_f,boiler - h_f,flash) / h_fg,flash * 100", ref:"Spirax Sarco Flash Guide", assumptions:"P_boiler > P_flash strictly enforced; HX outlet >= T_cold + 5°C.", limitations:"Bottom intermittent blowdown cannot feed plate HX.", inputs:[{k:"mbd",l:"Blowdown Mass Flow (kg/h)",v:300},{k:"pb",l:"Boiler Pressure bar(g)",v:10},{k:"pf",l:"Flash Vessel Pressure bar(g)",v:1.5}], run:(v)=>{ if(v.pb<=v.pf) return {error:"Validation Blocked: Boiler pressure P_boiler must strictly exceed P_flash!"}; const pct=((781.6-536.2)/2181.8)*100; return {primary:`${(v.mbd*pct/100).toFixed(1)} kg/h flash steam`, sub:`Flash Fraction: ${pct.toFixed(1)}% recovered to deaerator`}; } },
  { id:"CALC-07", title:"Boiler Feed Pump Hydraulic & Motor Power", bn:"বয়লার ফিড পাম্প হাইড্রোলিক ও মোটর পাওয়ার", cat:"Utility & Pumping", status:"IMPLEMENTED", formula:"P_hyd = (rho * g * Q * H) / 3.6e6", ref:"ISO 5199 / HI Standards", assumptions:"Centrifugal multistage pump; NPSHa verified >= NPSHr + 1.0m.", limitations:"Verify hot feedwater vapor pressure (85-95°C).", inputs:[{k:"q",l:"Flow Q (m3/h)",v:10},{k:"h",l:"Total Dynamic Head H (m)",v:140},{k:"rho",l:"Water Density (kg/m3)",v:965},{k:"ep",l:"Pump Efficiency (%)",v:68}], run:(v)=>{ const ph=(v.rho*9.80665*v.q*v.h)/3.6e6; const ps=ph/(v.ep/100); return {primary:`${ps.toFixed(2)} kW shaft (${(ps*1.15).toFixed(2)} kW rec. motor)`, sub:`Hydraulic Power: ${ph.toFixed(2)} kW`}; } },
  { id:"CALC-08", title:"Deaerator Steam Balance & Feedwater Heating", bn:"ডিয়ারেশন স্টিম ব্যালেন্স ও ফিডওয়াটার হিটিং", cat:"Boiler Thermal", status:"IMPLEMENTED", formula:"m_steam = m_feed * (h_feed - h_makeup) / (h_steam - h_makeup)", ref:"ASME Deaerator Guide", assumptions:"0.2 bar(g) dome (~105°C), <0.005 mg/L O2.", limitations:"Assumes negligible vent steam plume waste." },
  { id:"CALC-09", title:"Safety Valve Relieving Capacity Verification", bn:"সেফটি ভালভ রিলিভিং ক্যাপাসিটি ভেরিফিকেশন", cat:"Boiler Safety", status:"IMPLEMENTED", formula:"W = 0.51 * K_d * A * (1.03 * P_set,abs)", ref:"ASME BPVC Sec I / Boiler Rules 2025", assumptions:"Napier saturated steam check (0.51 vs 0.52515 conservative -2.89%).", limitations:"PRELIMINARY ESTIMATE ONLY: Cannot replace OCIB statutory witness test.", inputs:[{k:"kd",l:"Discharge Coeff K_d (0.40-0.975)",v:0.87},{k:"dia",l:"Valve Throat Diameter (mm)",v:32},{k:"ps",l:"Set Pressure bar(g)",v:10.5},{k:"mcr",l:"Boiler MCR (kg/h)",v:4000}], run:(v)=>{ const area=Math.PI*Math.pow(v.dia/2,2); const pabs=(v.ps+1.01325)*1.03*10; const w=0.51*v.kd*area*(pabs/9.80665); return {primary:`${w.toFixed(0)} kg/h capacity`, sub:`Area: ${area.toFixed(1)} mm2 | vs Boiler MCR ${v.mcr} kg/h -> ${w>=v.mcr?"ADEQUATE":"UNDERSIZED ALERT"}`}; } },
  { id:"CALC-10", title:"Economizer Flue Gas Heat Recovery", bn:"ইকোনোমাইজার ফ্লু গ্যাস হিট রিকভারি", cat:"Boiler Thermal", status:"IMPLEMENTED", formula:"Q_eco = m_gas * C_p,gas * (T_in - T_out)", ref:"Finned-Tube Economizer Std", assumptions:"Gas exit >= 120°C (gas) or >= 140°C (Jhut/heavy oil).", limitations:"Below acid dew point risks rapid tube corrosion." },
  { id:"CALC-11", title:"Forced Draft (FD) Fan & Combustion Air Sizing", bn:"এফডি ফ্যান ও কম্বাশন এয়ার ফ্লো নির্ধারণ", cat:"Combustion & Draught", status:"IMPLEMENTED", formula:"V_air = V_fuel * A_0 * (1 + EA%/100)", ref:"Combustion Fan Manual", assumptions:"Separates Nm3/min normal air from ambient FAD m3/min.", limitations:"Default A0=9.8 applies strictly to Natural Gas." },
  { id:"CALC-12", title:"Induced Draft (ID) Fan Sizing & Static Head", bn:"আইডি ফ্যান ড্রাফট ও মোটর রেটিং নির্ধারণ", cat:"Combustion & Draught", status:"IMPLEMENTED", formula:"P_ID = (Q_flue * dP_total) / (3600 * 1000 * eta_fan)", ref:"Boiler Draught Standard", assumptions:"-2 to -5 mm WC furnace draft for Jhut/coal boilers.", limitations:"Hot flue temperature dramatically reduces density." },
  { id:"CALC-13", title:"Chimney Natural Stack Draught", bn:"চিমনি ন্যাচারাল স্ট্যাক ড্রাফট হিসাব", cat:"Combustion & Draught", status:"IMPLEMENTED", formula:"dP = 353 * H * (1/T_amb - 1/T_flue)", ref:"Stack Barometric Draft", assumptions:"Smooth vertical stack neglecting wall friction.", limitations:"Does not model wind downdraught or cyclone losses." },
  { id:"CALC-14", title:"Steam Header & Distribution Pipe Sizing", bn:"স্টিম পাইপ ডায়ামিটার ও ভেলোসিটি হিসাব", cat:"Steam Distribution", status:"IMPLEMENTED", formula:"d = sqrt(4 * m_s * v_g / (pi * v * 3600)) * 1000", ref:"Spirax Sarco / ASME B31.1", assumptions:"Dry saturated steam at 25-35 m/s velocity.", limitations:"Long runs require pressure-drop check across valves." },
  { id:"CALC-15", title:"V-Belt Sizing, Speed Ratio & Tensioning", bn:"ভি-বেল্ট ড্রাইভ সাইজিং ও স্পিড রেশিও", cat:"Wash Plant Machinery", status:"IMPLEMENTED", formula:"L = 2C + (pi/2)*(D+d) + (D-d)^2/(4C)", ref:"ISO 4184 / RMA", assumptions:"Matched industrial SPZ/SPA/SPB/SPC belt sets.", limitations:"Verify wrap angle >= 120° on small sheave.", inputs:[{k:"D",l:"Driven Pulley D (mm)",v:450},{k:"d",l:"Driver Pulley d (mm)",v:150},{k:"C",l:"Center Distance C (mm)",v:600}], run:(v)=>({primary:`L_pitch = ${(2*v.C+(Math.PI/2)*(v.D+v.d)+Math.pow(v.D-v.d,2)/(4*v.C)).toFixed(1)} mm`, sub:`Speed Ratio: ${(v.D/v.d).toFixed(2)}:1 | Target Deflection: ~${(v.C/100).toFixed(1)} mm`}) },
  { id:"CALC-16", title:"Hydro Extractor Centrifugal G-Force & Rim Velocity", bn:"হাইড্রো এক্সট্রাক্টর সেন্ট্রিফিউগাল জি-ফোর্স", cat:"Wash Plant Machinery", status:"IMPLEMENTED", formula:"G = 0.00001118 * r_cm * N^2", ref:"ISO 10472 / Centrifuge Safety", assumptions:"Balanced rigid vertical cylindrical basket.", limitations:"CRITICAL: Never exceed nameplate max RPM.", inputs:[{k:"dia",l:"Basket Inner Dia (mm)",v:1100},{k:"rpm",l:"Spin Speed (RPM)",v:960}], run:(v)=>{ const rcm=(v.dia/2)/10; const g=0.00001118*rcm*v.rpm*v.rpm; const rim=Math.PI*(v.dia/1000)*v.rpm/60; return {primary:`${g.toFixed(0)} G-force`, sub:`Rim Speed: ${rim.toFixed(1)} m/s ${rim>65?"(HIGH RIM SPEED ALERT!)":"(Normal Range)"}`}; } },
  { id:"CALC-17", title:"Washing Batch Steam Consumption & Thermal Balance", bn:"ওয়াশ ব্যাচ স্টিম কনজাম্পশন", cat:"Wash Plant Utility", status:"IMPLEMENTED", formula:"Q = (m_w*Cp_w + m_g*Cp_g)*dT * 1.10", ref:"Textile Wet Processing Thermal Guide", assumptions:"10% drum radiation allowance included.", limitations:"Direct sparging mixes condensate into wash bath." },
  { id:"CALC-18", title:"Tumble Dryer Moisture Evaporation & Airflow", bn:"টাম্বল ড্রায়ার ময়েশ্চার ইভাপোরেশন", cat:"Wash Plant Machinery", status:"IMPLEMENTED", formula:"m_evap = m_wet - m_wet*(1-MC_in)/(1-MC_out)", ref:"Garment Drying Thermal Balance", assumptions:"Exhaust 65-80°C with clean lint screen.", limitations:"Fabric weave density alters falling-rate drying." },
  { id:"CALC-19", title:"Water Softener Resin Capacity & Salt Sizing", bn:"ওয়াটার সফটনার রেজিন ও লবণ হিসাব", cat:"Water Treatment", status:"IMPLEMENTED", formula:"V_run = (V_resin * Cap * 50) / Hardness_ppm", ref:"WQA / BS 2486 Ion Exchange", assumptions:"Conditional daily salt only with daily_m3 or regen_per_day.", limitations:"High raw iron/chlorine degrades cation resin." },
  { id:"CALC-20", title:"Compressed Air Velocity & Line Pressure Drop", bn:"কম্প্রেসড এয়ার ভেলোসিটি ও প্রেশার ড্রপ", cat:"Pneumatics & Air", status:"IMPLEMENTED", formula:"dP = (0.00075 * L * Q^1.85) / (d_cm^5 * P_abs)", ref:"CAGI / ISO 8573 Empirical Formula", assumptions:"Must stay <=0.1 bar/100m, velocity <=10 m/s.", limitations:"Empirical formula disclosed vs Darcy-Weisbach; excludes FRL drops.", inputs:[{k:"L",l:"Pipe Length L (m)",v:100},{k:"Q",l:"Free Air Flow Q (m3/min FAD)",v:15},{k:"d",l:"Inner Pipe Dia (mm)",v:50},{k:"p",l:"System Pressure bar(g)",v:7}], run:(v)=>{ const dcm=v.d/10; const pabs=v.p+1.01325; const dp=(0.00075*v.L*Math.pow(v.Q,1.85))/(Math.pow(dcm,5)*pabs); const area=Math.PI*Math.pow(v.d/2000,2); const vel=(v.Q/60/pabs)/area; return {primary:`dP = ${dp.toFixed(4)} bar (${(dp/v.L*100).toFixed(4)} bar/100m)`, sub:`Line Velocity: ${vel.toFixed(1)} m/s ${vel>10?"[OVERSPEED >10 m/s!]":"[OK <=10 m/s]"}`}; } }

// =========================================================================

function navigate(screenId, opts={}) {
  if (opts.eqId) appState.eqId = opts.eqId;
  if (opts.calcId) appState.calcId = opts.calcId;
  if (opts.chkId) appState.chkId = opts.chkId;
  if (opts.famFilter !== undefined) appState.eqFamFilter = opts.famFilter;
  appState.screen = screenId;
  closeDrawer();
  closeDialog();
  renderAll();
  // Close mobile companion overlays if open
  document.getElementById("panelLeft").classList.remove("mob-open");
  document.getElementById("panelRight").classList.remove("mob-open");
}

function toggleMobPanel(side) {
  const id = side === "left" ? "panelLeft" : "panelRight";
  const other = side === "left" ? "panelRight" : "panelLeft";
  document.getElementById(other).classList.remove("mob-open");
  document.getElementById(id).classList.toggle("mob-open");
}

function setPhoneWidth(w, btn) {
  document.getElementById("phoneFrame").style.setProperty("--phone-w", w + "px");
  document.querySelectorAll(".width-toolbar .ctrl-btn").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
}

function toggleAppTheme() {
  appState.theme = appState.theme === "dark" ? "light" : "dark";
  renderAll();
}

function toggleLegible() {
  appState.legible = !appState.legible;
  renderAll();
}

function openDrawer() { document.getElementById("drawerBackdrop").classList.add("open"); }
function closeDrawer() { document.getElementById("drawerBackdrop").classList.remove("open"); }
function openDialog(html) {
  document.getElementById("phoneDialogBody").innerHTML = html;
  document.getElementById("phoneDialog").style.display = "flex";
}
function closeDialog() { document.getElementById("phoneDialog").style.display = "none"; }

function showCallouts() { return document.getElementById("chkShowCallouts").checked; }
function callout(text) {
  if (!showCallouts()) return "";
  return `<div class="audit-callout"><strong>UI Audit Note:</strong> ${text}</div>`;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function depthBadge(depth) {
  if (depth === "FULL_CONTENT_BLUEPRINT") return `<span class="depth-pill dp-full">FULL BLUEPRINT</span>`;
  if (depth === "PARTIAL_CONTENT_BLUEPRINT") return `<span class="depth-pill dp-partial">PARTIAL</span>`;
  if (depth === "RESEARCH_PENDING") return `<span class="depth-pill dp-pending">RESEARCH PENDING</span>`;
  return `<span class="depth-pill dp-inv">INVENTORY ONLY</span>`;
}

function getModMeta(id) {
  return MODULES_CATALOG.find(m => m.id === id) || MODULES_CATALOG[0];
}

function runCalc(cid) {
  const cl = CALCULATIONS.find(x=>x.id===cid);
  if (!cl || !cl.run) return;
  const vals = {};
  for (const inp of cl.inputs) {
    const raw = parseFloat(document.getElementById(`inp_${cid}_${inp.k}`).value);
    if (!Number.isFinite(raw) || raw <= 0) {
      appState.calcOutputs[cid] = { error: `Invalid or non-positive input for ${inp.l}.` };
      renderScreen();
      return;
    }
    inp.v = raw;
    vals[inp.k] = raw;
  }
  appState.calcOutputs[cid] = cl.run(vals);
  renderScreen();
}

function selectUnitCat(k) {
  appState.unitCat = k;
  const units = UNIT_DEFS[k].units;
  appState.unitFrom = units[0][0];
  appState.unitTo = (units[1] || units[0])[0];
  renderScreen();
}

function computeUnitConversion(val, catKey, fromU, toU) {
  if (!Number.isFinite(val)) return { err: "Enter a finite number." };
  const cat = UNIT_DEFS[catKey];
  if (cat.min !== undefined && val < cat.min) return { err: `${cat.name} cannot be negative (${val} < 0).` };
  if (catKey === "TEMPERATURE") {
    let k = fromU[0]==="C"?val+273.15:fromU[0]==="F"?(val-32)*5/9+273.15:fromU[0]==="R"?val*5/9:val;
    if (k < 0) return { err: "Physical Limit Rejected: Temperature cannot be below absolute zero (0 K / -273.15 °C)." };
    let res = toU[0]==="C"?k-273.15:toU[0]==="F"?(k-273.15)*9/5+32:toU[0]==="R"?k*9/5:k;
    return { val: Number(res.toPrecision(6)).toString() };
  }
  if (catKey === "PRESSURE") {
    const P_ATM = 101325;
    let absPa = val * fromU[2] + (fromU[3]==="G" ? P_ATM : 0);
    if (absPa < 0) return { err: "Physical Limit Rejected: Absolute pressure cannot fall below hard vacuum (0 bar(a) / -1.01325 bar(g))." };
    let res = (absPa - (toU[3]==="G" ? P_ATM : 0)) / toU[2];
    return { val: Number(res.toPrecision(6)).toString() };
  }
  if ((catKey === "SPEED" || catKey === "VISCOSITY") && fromU[3] !== toU[3]) {
    return { err: catKey==="SPEED"
      ? `Cannot convert linear speed (${fromU[1]}) directly to rotational (${toU[1]}) without pulley radius r.`
      : `Cannot convert dynamic (${fromU[1]}) and kinematic (${toU[1]}) viscosity without fluid density rho.` };
  }
  const base = val * fromU[2];
  const res = base / toU[2];
  return { val: Number(res.toPrecision(6)).toString() };
}

function openNoteEditor() {
  openDialog(`
    <h4 style="margin:0;">New Field Note</h4>
    <input class="m3-input" id="dlgEq" value="EQ-A01" placeholder="Equipment ID (e.g. EQ-A01)">

    <textarea class="m3-input" id="dlgBody" rows="3" placeholder="Maintenance observation..."></textarea>
    <div class="grid-2">
      <button class="m3-btn outlined" onclick="closeDialog()">Cancel</button>
      <button class="m3-btn filled" onclick="saveNewNote()">Save</button>
    </div>
  `);
}

function saveNewNote() {
  const eq = document.getElementById("dlgEq").value.trim() || "EQ-A01";
  const t = document.getElementById("dlgTitle").value.trim();
  const b = document.getElementById("dlgBody").value.trim();
  if (!t || !b) return;
  appState.notes.unshift({ id: Date.now(), eq, title: t, body: b, time: "Just now" });
  closeDialog();
  renderScreen();
}

function deleteNote(id) {
  appState.notes = appState.notes.filter(n=>n.id!==id);
  renderScreen();
}

function showBackupExport() {
  const payload = JSON.stringify({
    backup_version: 3,
    sha256: "simulated_sha256_integrity_digest",
    counts: { notes: appState.notes.length, bookmarks: appState.bookmarks.size, checks: appState.chkChecked.size, calc_history: appState.calcHistoryCount, custom_checklists: 0, checklist_execution_metadata: 0 },
    notes: appState.notes,
    bookmarks: Array.from(appState.bookmarks)
  }, null, 2);
  openDialog(`
    <h4 style="margin:0;">Backup JSON Preview (backup_version: 3)</h4>
    <pre style="font-size:0.7em;background:rgba(0,0,0,0.25);padding:8px;border-radius:8px;overflow:auto;max-height:220px;">${escapeHtml(payload)}</pre>
    <div class="grid-2">
      <button class="m3-btn outlined" onclick="closeDialog()">Close</button>
      <button class="m3-btn filled" onclick="closeDialog()">Save via SAF</button>
    </div>
  `);
}

function renderAll() {
  const frame = document.getElementById("phoneFrame");
  frame.setAttribute("data-theme", appState.theme);
  frame.classList.toggle("legible", appState.legible);
  document.getElementById("btnToggleTheme").textContent = "Theme: " + (appState.theme==="dark"?"Dark":"Light");

  document.getElementById("btnAuditMode").classList.toggle("active", appState.screen==="audit");
  renderModuleIndex();
  renderDrawer();
  renderInspector();
  renderScreen();
}

renderAll();
